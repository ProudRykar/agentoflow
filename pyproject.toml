[project]
name = "agent-workflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ProudRykar", email = "proudrykar@mail.ru" }
]
requires-python = ">=3.12.8"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tiktoken>=0.7",
    "trafilatura>=2.2.0",
    "uvicorn>=0.30.0",
    # uvicorn needs an explicit WebSocket implementation; without
    # it, upgrade requests fail and /ws/* returns 404.
    "websockets>=13.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
agentoflow = "agent_workflow.cli.main:main"
agentoflow-web = "agent_workflow.web.app:main"
